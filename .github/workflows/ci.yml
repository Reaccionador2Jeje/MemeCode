name: MemeCode checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-safety-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check out Memingo runtime
        uses: actions/checkout@v4
        with:
          repository: Reaccionador2Jeje/Memingo
          ref: feat/arch-aur-packaging
          path: .memingo-runtime
      - name: Install Memingo runtime
        run: python -m pip install ./.memingo-runtime
      - name: Validate Memingo core
        run: memingo check src
      - name: Compile Python modules
        run: python -m py_compile runtime/host_bridge.py neural/tokenizer.py neural/model.py neural/train.py neural/generate.py
      - name: Validate installer shell syntax
        run: sh -n install.sh
      - name: Run safety tests
        run: python -m unittest discover -s tests -v

  windows-installer-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
